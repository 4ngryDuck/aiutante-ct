name: Idea / feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: The idea, description: "What would you like the panel to do?" }
    validations: { required: true }
  - type: checkboxes
    id: rule
    attributes:
      label: House rule
      options:
        - label: "It keeps the panel click-only: no automation and no internal API calls on Character Tavern."
          required: true
